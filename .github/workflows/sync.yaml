# Keeps masto.nyc's domain blocks in step with the IFTAS denylists.
#
# This lives in its own repository rather than in masto.nyc-docean, which holds
# the Kubernetes, Terraform and Flux configuration. Two reasons. allowlist.csv
# is a moderation artifact, and editing it should not require write access to a
# repository that can deploy the cluster and rotate database credentials. And
# the admin token belongs somewhere narrower than a secret store that also
# carries the DigitalOcean, Cloudflare and Spaces credentials.
#
# Nothing here touches the cluster: this talks to the Mastodon admin API over
# HTTPS and needs a runner and a pip install.
#
# This replaces a job that was lost. The archived masto.nyc repository ran
# `fediblock-sync` as a weekly in-cluster CronJob against oliphant's Tier 0
# list. It did not survive the migration here, nothing recorded dropping it,
# and policies.md went on promising a subscription the infrastructure had
# stopped honouring. See README.md.
#
# Nothing is stored. There is no committed copy of the blocklist: what this
# instance blocks is whatever /api/v1/admin/domain_blocks says it blocks, and
# that is what the merged lists are compared against. The only file under
# version control is allowlist.csv, which is hand-written
# configuration rather than fetched data.
#
# Routine updates apply themselves. A person is pulled in only when the change
# is anomalously large, which is the one case where "a list said so" is not a
# good enough reason. scripts/check.py decides which it is and says
# `ok`, `review`, or `fail`.
#
# A workflow rather than the old CronJob: that job needed an unpinned image
# from a private third-party registry behind an imagePullSecret, which is most
# of why it was lost. Nothing here touches the cluster.
name: Sync blocked fedi domains

on:
  schedule:
    # 11:00 UTC daily. Clear of the backup (01:30), sync-blocked-email-domains
    # (03:00), its watchdog (09:00) and the Mastodon upgrade check (13:00).
    - cron: '0 11 * * *'
  workflow_dispatch:
    inputs:
      allow_large_change:
        description: 'Apply a change the size gate held back. Read the held run first.'
        type: boolean
        default: false

permissions:
  contents: read

env:
  # Pinned. Unpinned tooling is what made the old job unreproducible.
  FEDIBLOCKHOLE_VERSION: '0.4.6'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # No setup-python: the runner has one, and this repository pins every
      # action by digest, so that would be another digest to carry for nothing.
      # A venv rather than a bare pip install, which newer runner images refuse
      # without --break-system-packages.
      - name: Install fediblockhole
        run: |
          set -euo pipefail
          python3 -m venv /tmp/fbh
          /tmp/fbh/bin/pip install --quiet "fediblockhole==${FEDIBLOCKHOLE_VERSION}"
          /tmp/fbh/bin/fediblock-sync --version

      # Inert without its secret, like monitoring.tf. Reading the instance's
      # current blocks is what makes the comparison possible, so with no token
      # there is nothing to compare and nothing honest to do.
      - name: Check for the token
        id: token
        env:
          TOKEN: ${{ secrets.MASTODON_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${TOKEN:-}" ]; then
            echo "::notice::MASTODON_ADMIN_TOKEN is not set, so there is nothing to compare against."
            echo "have_token=no" >> "$GITHUB_OUTPUT"
            {
              echo "### Skipped"
              echo
              echo "\`MASTODON_ADMIN_TOKEN\` is not configured. It needs"
              echo "\`admin:read:domain_blocks\` and \`admin:write:domain_blocks\`."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "have_token=yes" >> "$GITHUB_OUTPUT"
          fi

      # The admin API paginates with Link headers rather than a page count, so
      # this follows rel="next" until it runs out. Fetching only the first page
      # would make every domain past it look like a new block.
      - name: Read what the instance currently blocks
        if: steps.token.outputs.have_token == 'yes'
        env:
          TOKEN: ${{ secrets.MASTODON_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          import json, os, urllib.error, urllib.request, re, sys


          def refused(exc):
              """Say who refused, not just that somebody did.

              A bare "HTTP Error 403: Forbidden" is the least useful thing this
              job can report, and it is what run 38394671307 reported. Mastodon
              answers a scope or role problem with a JSON error body; anything
              in front of it -- Cloudflare, a WAF, a tunnel -- answers with HTML
              and its own headers. They are the same status code and completely
              different problems, so print enough to tell them apart.
              """
              print("the request was refused: HTTP %s %s" % (exc.code, exc.reason))
              for header in ("server", "content-type", "cf-ray", "cf-mitigated",
                             "www-authenticate", "x-ratelimit-remaining",
                             "retry-after"):
                  value = exc.headers.get(header)
                  if value:
                      print("  %s: %s" % (header, value))
              try:
                  body = exc.read(600).decode("utf-8", "replace").strip()
              except Exception:
                  body = "(unreadable)"
              print("  body: %s" % (body or "(empty)"))
              # Mastodon's three 403 bodies are three different gates, and the
              # exact strings are the only way to tell them apart. Read out of
              # mastodon/mastodon rather than guessed:
              #
              #   "outside the authorized scopes"  Doorkeeper: the token's scopes
              #   "This action is not allowed"     Mastodon::NotPermittedError
              #   "Forbidden"                      respond_with_error(403), which
              #                                    renders HTTP_STATUS_CODES[403]
              #                                    for Pundit::NotAuthorizedError
              #
              # The last one is the policy check -- DomainBlockPolicy#index? asking
              # role.can?(:manage_federation). Crucially it evaluates the role of
              # the *user attached to the token*, which is a separate gate from the
              # scope check above it. A token with the right scopes and no user
              # behind it passes the first and fails the second, which looks exactly
              # like a misconfigured role on an instance whose roles are all fine.
              # That cost a day on run 39366345446, so whoami() below settles it.
              cause = "HTTP %s from the admin API" % exc.code
              if "outside the authorized scopes" in body:
                  cause = "the token's scopes do not cover admin:read"
                  print("  -> Doorkeeper refused this on scopes. The token needs "
                        "admin:read:domain_blocks, or the broader admin:read.")
              elif "This action is not allowed" in body:
                  cause = "Mastodon refused the request outright"
                  print("  -> Mastodon refused this explicitly (NotPermittedError), "
                        "which is neither the scopes nor the policy.")
              elif "text/html" in (exc.headers.get("content-type") or ""):
                  cause = "something in front of masto.nyc blocked the runner"
                  print("  -> an HTML body is not Mastodon. Something in front of the "
                        "instance refused the runner; check for a WAF or bot rule, "
                        "not the token.")
              elif '"Forbidden"' in body:
                  cause = "Mastodon's authorization policy refused the token"
                  print("  -> this is Mastodon's authorization policy, not its scope "
                        "check: the scopes passed and DomainBlockPolicy#index? then "
                        "refused. It asks role.can?(:manage_federation) of the user "
                        "attached to the token, so either that user's role lacks the "
                        "permission or no user is attached at all.")
              elif exc.code == 401:
                  cause = "the token is not valid on masto.nyc"
                  print("  -> 401 is the token itself being rejected: wrong, revoked "
                        "or truncated, rather than insufficiently privileged.")

              # whoami knows more than the status code does, so it gets the last
              # word on the cause. The notification carries this one line, which
              # is the difference between somebody acting on it and somebody
              # opening the run to find out what happened.
              with open("/tmp/failure.txt", "w", encoding="utf-8") as fh:
                  fh.write("masto.nyc would not let the job read its domain "
                           "blocks: %s." % (whoami() or cause))
              sys.exit(1)


          def whoami():
              """Who the token says it is.

              A policy refusal says we were not allowed; this says who we were.
              Both endpoints are read-only and neither needs an admin scope.

              The decisive case is a 422 from accounts/verify_credentials. Per
              Api::BaseController, require_user! renders "This method requires an
              authenticated user" with 422 when there is no current_user -- so a
              422 here means no user is bound to this token at all. That is an
              application or client-credentials token, and it explains a policy
              refusal on an instance where every role is correct.
              """
              verdict = None
              print("what this token is:")
              for path, label in (
                  ("/api/v1/apps/verify_credentials", "application"),
                  ("/api/v1/accounts/verify_credentials", "user"),
              ):
                  req = urllib.request.Request("https://masto.nyc" + path, headers={
                      "Authorization": "Bearer " + token,
                      "User-Agent": "masto.nyc blocklist-sync",
                  })
                  try:
                      with urllib.request.urlopen(req, timeout=15) as resp:
                          data = json.load(resp)
                  except urllib.error.HTTPError as exc:
                      detail = exc.read(200).decode("utf-8", "replace").strip()
                      print("  %s: HTTP %s %s" % (label, exc.code, detail))
                      if exc.code == 401:
                          verdict = "the token is not valid on masto.nyc any more"
                      elif label == "user" and exc.code == 422:
                          verdict = ("the token has no user attached, so every "
                                     "policy check fails whatever the roles say")
                          print("    -> no user is bound to this token. It is an "
                                "application token, not a user token, so every "
                                "policy check fails however the roles are set. "
                                "Issue a user token instead.")
                      continue
                  except Exception as exc:  # noqa: BLE001 - diagnostics only
                      print("  %s: could not be checked (%s)" % (label, exc))
                      continue
                  if label == "application":
                      print("  application: %r" % (data.get("name") or "(unnamed)"))
                  else:
                      print("  user: @%s (account id %s)" % (
                          data.get("username"), data.get("id")))
                      verdict = ("the token is @%s's, and that account is not "
                                 "allowed to manage federation"
                                 % data.get("username"))
              return verdict

          token = os.environ["TOKEN"]
          url = "https://masto.nyc/api/v1/admin/domain_blocks?limit=200"
          blocks, pages = [], 0

          while url and pages < 50:
              req = urllib.request.Request(url, headers={
                  "Authorization": "Bearer " + token,
                  "User-Agent": "masto.nyc blocklist-sync",
              })
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      body = json.load(resp)
                      link = resp.headers.get("Link", "")
              except urllib.error.HTTPError as exc:
                  refused(exc)
              except urllib.error.URLError as exc:
                  sys.exit("could not reach masto.nyc at all: %s. That is the network "
                           "or the instance being down, not the token." % exc.reason)
              if not isinstance(body, list):
                  sys.exit("admin API returned %s, not a list of blocks" % type(body).__name__)
              blocks += body
              pages += 1
              m = re.search(r'<([^>]+)>;\s*rel="next"', link)
              url = m.group(1) if m else None

          print("fetched %d blocks over %d page(s)" % (len(blocks), pages))
          json.dump(blocks, open("/tmp/instance.json", "w"))
          PYEOF

      - name: Merge the lists and apply the allowlist
        if: steps.token.outputs.have_token == 'yes'
        run: |
          set -euo pipefail
          cp sources.toml /tmp/runtime.toml
          cat >> /tmp/runtime.toml <<EOF

          allowlist_url_sources = [
            { url = 'file://${GITHUB_WORKSPACE}/allowlist.csv', format = 'csv' },
          ]
          EOF
          /tmp/fbh/bin/fediblock-sync -c /tmp/runtime.toml \
            --no-push-instance --no-fetch-instance \
            -o /tmp/candidate.csv --loglevel info

      - name: Decide whether it can apply itself
        id: decide
        if: steps.token.outputs.have_token == 'yes'
        env:
          # For /api/v1/admin/measures: check.py asks the follow question
          # fediblockhole will ask, so a suspend the guard is going to refuse
          # is not reported as a change.
          TOKEN: ${{ secrets.MASTODON_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          # The script exits non-zero only on `fail`. `review` is a decision,
          # not an error, so it exits 0 and the verdict is read from stdout.
          set +e
          python3 scripts/check.py /tmp/candidate.csv /tmp/instance.json \
            /tmp/applicable.csv /tmp/remove.tsv > /tmp/report.txt
          rc=$?
          set -e
          cat /tmp/report.txt
          verdict=$(grep -oP '^verdict=\K\w+' /tmp/report.txt || echo fail)
          if [ "$verdict" = "error" ]; then
            # Not the lists' fault, so Discord takes the "sync failed" path and
            # carries this line, the same as a failure before the gate.
            grep -oP '^reason: \K.*' /tmp/report.txt | head -1 > /tmp/failure.txt
          fi
          echo "verdict=${verdict}" >> "$GITHUB_OUTPUT"
          echo "changes=$(grep -c '^  [+^-]' /tmp/report.txt || true)" >> "$GITHUB_OUTPUT"
          {
            echo "### Blocklist sync: \`${verdict}\`"
            echo
            echo '```'
            cat /tmp/report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

      # Push only the additions and escalations the gate approved. The source
      # here is /tmp/applicable.csv, which check.py wrote: the merged candidate
      # minus the lists' `.invalid` canary rows. Never /tmp/candidate.csv --
      # that one still has the canaries in it, and fediblockhole cannot delete
      # a block once it is made. fediblockhole fetches the instance's own blocks
      # to work out the difference, so nothing already correct is touched.
      #
      # max_followed_severity = 'silence' is the guard that matters. Every row
      # in these lists is `suspend`, and a suspend severs existing follow
      # relationships; this caps it at silence for any domain somebody here
      # already follows. The old job did the same.
      #
      # It never unblocks anything: fediblockhole has a delete_block function
      # and no code path that calls it.
      - name: Apply it
        id: apply
        if: >-
          steps.token.outputs.have_token == 'yes' &&
          (steps.decide.outputs.verdict == 'ok' ||
           (steps.decide.outputs.verdict == 'review' && inputs.allow_large_change))
        env:
          TOKEN: ${{ secrets.MASTODON_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${{ steps.decide.outputs.changes }}" = "0" ]; then
            echo "Nothing to apply." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "${{ steps.decide.outputs.verdict }}" = "review" ]; then
            echo "::warning::Applying a change the size gate held, because allow_large_change was set."
          fi

          # Pre-flight the one endpoint whose scope is easy to miss.
          #
          # max_followed_severity below makes fediblockhole call
          # /api/v1/admin/measures for every new block and every severity
          # escalation, and that endpoint needs the broad `admin:read` scope
          # rather than the admin:*:domain_blocks pair everything else here
          # uses. Without it the push dies partway: run 38391365273 rewrote
          # three public_comments, hit 403 on its first new block, and left the
          # instance in a state nobody had asked for.
          #
          # Probing once, before anything is pushed, converts that into a
          # failure that changed nothing. The domain is a reserved one from
          # RFC 2606 so the query matches nothing and returns a count of zero;
          # the status code is the whole point, not the body.
          code=$(curl -sS -o /tmp/measures.json -w '%{http_code}' \
            -X POST "https://masto.nyc/api/v1/admin/measures" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H 'Content-Type: application/json' \
            -d '{"keys":["instance_follows"],"instance_follows":{"domain":"example.invalid"}}')
          case "$code" in
            200)
              echo "Token can read admin measures, so the follow-severity guard will work." ;;
            403)
              echo "::error::The token cannot read /api/v1/admin/measures (403). That endpoint needs the admin:read scope, which max_followed_severity depends on. Nothing was applied. Either add admin:read to MASTODON_ADMIN_TOKEN, or drop the follow guard deliberately."
              head -c 300 /tmp/measures.json || true
              exit 1 ;;
            *)
              echo "::error::/api/v1/admin/measures returned HTTP ${code}, so the follow-severity guard cannot be trusted. Nothing was applied. This is not necessarily a scope problem -- check the instance is healthy."
              head -c 300 /tmp/measures.json || true
              exit 1 ;;
          esac

          cat > /tmp/apply.toml <<EOF
          blocklist_url_sources = [
            { url = 'file:///tmp/applicable.csv', format = 'csv' },
          ]
          allowlist_url_sources = [
            { url = 'file://${GITHUB_WORKSPACE}/allowlist.csv', format = 'csv' },
          ]
          blocklist_instance_destinations = [
            { domain = 'masto.nyc', token = '${TOKEN}', max_followed_severity = 'silence' },
          ]
          import_fields = ['public_comment']
          mergeplan = 'min'
          EOF

          /tmp/fbh/bin/fediblock-sync -c /tmp/apply.toml --loglevel info \
            --override-private-comment "masto.nyc blocklist-sync $(date -u +%Y-%m-%d)"

          # Lift the blocks on allowlisted domains. fediblockhole defines
          # delete_block and never calls it, so this is ours to do.
          #
          # The list comes from check.py and contains nothing but allowlisted
          # domains it found still blocked. It is deliberately not derived here:
          # the step that decides is the step that gets reviewed, and an apply
          # step that worked out its own removals could widen them.
          #
          # Additions go first. If the push fails the job stops before lifting
          # anything, which is the right way round -- a half-finished run that
          # blocked too much is recoverable, one that unblocked too much is a
          # federation change nobody asked for.
          lifted=0
          while IFS=$'\t' read -r block_id domain; do
            [ -n "${block_id:-}" ] || continue
            code=$(curl -sS -o /tmp/lift.json -w '%{http_code}' \
              -X DELETE "https://masto.nyc/api/v1/admin/domain_blocks/${block_id}" \
              -H "Authorization: Bearer ${TOKEN}")
            case "$code" in
              200)
                echo "lifted the block on ${domain} (id ${block_id})"
                lifted=$((lifted + 1)) ;;
              404)
                # Already gone, which is the state we wanted. Not a lift, so it
                # is not counted as one.
                echo "${domain} (id ${block_id}) was already unblocked" ;;
              *)
                echo "::error::Could not lift the block on ${domain} (id ${block_id}): HTTP ${code}."
                head -c 300 /tmp/lift.json || true
                exit 1 ;;
            esac
            sleep 1
          done < /tmp/remove.tsv
          if [ "$lifted" -gt 0 ]; then
            echo "Lifted ${lifted} block(s) on allowlisted domains." >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "Applied." >> "$GITHUB_STEP_SUMMARY"

      # One message per run that did something, carrying the actual diff.
      #
      # Same shape as terraform.yaml's notify-pending: Slack-formatted JSON to
      # /slack, built with jq so domain names and comments cannot break out of
      # the payload, and a non-200 warns rather than failing the run -- the
      # blocks are already applied by then and a red X would not undo them.
      #
      # The headline is keyed on whether the apply step actually succeeded, not
      # on the verdict. Reading the verdict alone would announce "3 changes
      # applied" after a push that died halfway through the admin API.
      - name: Say what happened in Discord
        if: always() && steps.token.outputs.have_token == 'yes'
        env:
          WEBHOOK: ${{ secrets.DISCORD_OPS_WEBHOOK }}
          VERDICT: ${{ steps.decide.outputs.verdict }}
          CHANGES: ${{ steps.decide.outputs.changes }}
          APPLIED: ${{ steps.apply.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -z "${WEBHOOK:-}" ]; then
            echo "::notice::DISCORD_OPS_WEBHOOK is not set, so nothing was sent."
            exit 0
          fi
          # A clean run with nothing to do says nothing. A channel that gets a
          # daily "nothing to report" is a channel that gets muted, and a muted
          # channel is worse than no channel.
          if [ "${VERDICT:-}" = "ok" ] && [ "${CHANGES:-0}" = "0" ]; then
            echo "Nothing changed, so nothing was sent."
            exit 0
          fi

          # The diff itself: the + and ^ lines scripts/check.py emitted.
          # Capped, because Discord rejects a message over 2000 characters and
          # a genuinely large change would blow past that. The cap says so
          # rather than silently truncating, and the run link has the rest.
          grep '^  [+^-]' /tmp/report.txt > /tmp/diff.txt 2>/dev/null || true
          total=$(wc -l < /tmp/diff.txt)
          if [ "$total" -gt 25 ]; then
            { head -25 /tmp/diff.txt; echo "  ... and $(( total - 25 )) more, see the run"; } > /tmp/diff.shown
          else
            cp /tmp/diff.txt /tmp/diff.shown
          fi

          # Not ${VERDICT:-fail}: an empty verdict means no verdict was
          # reached, which is the `*)` case below, not a `fail`.
          case "${VERDICT:-}" in
            ok|review)
              if [ "${APPLIED:-skipped}" = "success" ]; then
                if [ "${VERDICT}" = "review" ]; then
                  head="**Blocklist updated** (a held change, accepted by hand): ${CHANGES} applied to masto.nyc."
                else
                  head="**Blocklist updated**: ${CHANGES} applied to masto.nyc."
                fi
                detail=$(cat /tmp/diff.shown)
              elif [ "${APPLIED:-skipped}" = "failure" ]; then
                head="**Blocklist apply FAILED** after ${CHANGES} change(s) were approved. Some may have landed and some may not."
                detail="$(cat /tmp/diff.shown)"
              else
                head="**Blocklist change held for review**: ${CHANGES} change(s), over the size gate. Nothing applied. Re-run with allow_large_change to accept it."
                detail=$(cat /tmp/diff.shown)
              fi ;;
            fail)
              head="**Blocklist sync rejected the lists it fetched.** Nothing changed on masto.nyc."
              detail=$(grep '^reason:' /tmp/report.txt 2>/dev/null | head -5) ;;
            *)
              # No verdict: a step before the gate died, so check.py never ran.
              # Distinct from `fail`, where it ran and distrusted the data --
              # blaming the lists here would be wrong, which is what run
              # 38394671307 did.
              #
              # /tmp/failure.txt is the one line the failing step wrote about
              # itself. The old message said "see the run" instead, which is
              # the notification admitting it has nothing to tell you.
              head="**Blocklist sync failed.** Nothing changed on masto.nyc."
              detail=$(cat /tmp/failure.txt 2>/dev/null) ;;
          esac

          base="${WEBHOOK%/}"; base="${base%/slack}"; base="${base%/github}"

          # A secret pasted by hand can carry a trailing newline or lose its
          # scheme, and neither is visible in a masked log: run 38398720935
          # printed `curl: (6) Could not resolve host: ***`, which failed the
          # step and buried the 403 that was the actual problem.
          base="$(printf '%s' "$base" | tr -d '[:space:]')"
          case "$base" in
            https://*) ;;
            *)
              # Say what the stored value looks like without printing it.
              # Knowing it is "not a URL" cost three days on its own; the
              # length alone separates a bare token from a truncated URL from
              # a stray character, and none of these facts reveal the secret.
              # A prefix would, because GitHub masks the whole value and not
              # substrings of it, so this prints no part of it.
              raw_len=${#WEBHOOK}
              trimmed_len=${#base}
              if printf '%s' "$base" | grep -qE '^[A-Za-z0-9_-]{50,100}$'; then
                shape="looks like the token on its own, with no https://discord.com/api/webhooks/<id>/ in front of it"
              elif printf '%s' "$base" | grep -q 'discord\.com'; then
                shape="contains discord.com but does not begin with https://"
              elif [ "$raw_len" -ne "$trimmed_len" ]; then
                shape="carries whitespace that trimming did not rescue"
              else
                shape="matches nothing expected"
              fi
              echo "::warning::DISCORD_OPS_WEBHOOK is not an https:// URL, so nothing was sent. ${raw_len} characters as stored, ${trimmed_len} after trimming; it ${shape}. For reference a full webhook URL is about 121 characters, or 127 with /slack. Check for a repository-level secret shadowing the organisation one -- the repository one wins."
              echo "Discord was not notified: the webhook secret is not a URL (${raw_len} chars; it ${shape})." >> "$GITHUB_STEP_SUMMARY"
              exit 0 ;;
          esac

          # An empty fence is noise, so the detail block is only included when
          # there is something in it.
          if [ -n "$detail" ]; then
            jq -nc --arg head "$head" --arg detail "$detail" --arg url "$RUN_URL" \
              '{text: ($head + "\n```\n" + $detail + "\n```\n" + $url)}' > /tmp/payload.json
          else
            jq -nc --arg head "$head" --arg url "$RUN_URL" \
              '{text: ($head + "\n" + $url)}' > /tmp/payload.json
          fi

          # This step reports; it does not decide. A notifier that cannot be
          # reached must not invent a failure, nor mask the one the rest of the
          # job already found, so every outcome here is a warning and an exit 0.
          set +e
          code=$(curl -sS -o /tmp/response -w '%{http_code}' \
            -X POST -H 'Content-Type: application/json' \
            --data @/tmp/payload.json "${base}/slack")
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "::warning::Could not reach Discord (curl exit ${rc}), so nothing was sent. Whatever the rest of this run concluded still stands."
            echo "Discord was not notified: could not reach the webhook." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$code" != "200" ] && [ "$code" != "204" ]; then
            echo "::warning::Discord returned HTTP ${code}, so the message was not delivered. Whatever the rest of this run concluded still stands."
            head -c 300 /tmp/response || true
          fi

      # Red when a person is needed. A held moderation decision and untrusted
      # input are both things that should not look like success in the run list.
      - name: Fail if a person is needed
        if: steps.token.outputs.have_token == 'yes'
        run: |
          set -euo pipefail
          case "${{ steps.decide.outputs.verdict }}" in
            ok) exit 0 ;;
            review)
              if [ "${{ inputs.allow_large_change }}" = "true" ]; then exit 0; fi
              echo "::error::The change is larger than the gate allows. Read the summary, then re-run with allow_large_change if it is right."
              exit 1 ;;
            error)
              echo "::error::$(cat /tmp/failure.txt 2>/dev/null) Nothing was applied."
              exit 1 ;;
            *)
              echo "::error::The fetched blocklist data did not pass its checks. Nothing was applied."
              exit 1 ;;
          esac
